{% extends "base.html" %}

{% block title %}Create Test - TEST NOVA{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">
        <a href="{{ url_for('teacher_dashboard') }}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <div class="card shadow-sm border-0">

        <div class="card-header bg-primary text-white p-4">
            <h3 class="mb-1">
                <i class="bi bi-plus-circle"></i>
                Create New Test
            </h3>

            <p class="mb-0">
                Enter the basic information for your test.
            </p>
        </div>

        <div class="card-body p-4">

            <form method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Test Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            placeholder="Example: Python Programming Test"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Subject
                        </label>

                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            placeholder="Example: Python"
                            required
                        >
                    </div>

                </div>


                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">
                            Category
                        </label>

                        <select
                            name="category"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Programming">
                                Programming
                            </option>

                            <option value="Computer Science">
                                Computer Science
                            </option>

                            <option value="Mathematics">
                                Mathematics
                            </option>

                            <option value="General Knowledge">
                                General Knowledge
                            </option>

                            <option value="Aptitude">
                                Aptitude
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>
                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label fw-bold">
                            Time Limit
                        </label>

                        <div class="input-group">

                            <input
                                type="number"
                                name="time_limit"
                                class="form-control"
                                min="1"
                                placeholder="30"
                                required
                            >

                            <span class="input-group-text">
                                Minutes
                            </span>

                        </div>

                    </div>


                    <div class="col-md-3 mb-3">

                        <label class="form-label fw-bold">
                            Total Marks
                        </label>

                        <input
                            type="number"
                            name="total_marks"
                            class="form-control"
                            min="1"
                            placeholder="20"
                            required
                        >

                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-bold">
                        Passing Marks
                    </label>

                    <input
                        type="number"
                        name="passing_marks"
                        class="form-control"
                        min="0"
                        placeholder="8"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label fw-bold">
                        Test Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="Write a short description about this test..."
                    ></textarea>

                </div>


                <div class="d-flex justify-content-end">

                    <button
                        type="submit"
                        class="btn btn-primary btn-lg"
                    >

                        <i class="bi bi-check-circle"></i>

                        Create Test

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
